# Reusable workflow: build firmware images with the OpenWrt ImageBuilder, one
# job per profile of the `profiles` input, with the package
# built by build.yml (artifact apk-<package>-<line>-<arch>) installed in each
# when there is one. The image choices (profiles, extra packages) belong to
# the caller; the profiles are checked against the official profiles.json of
# the line before any job starts.
#
# The ImageBuilder comes from the harness image ghcr.io/<owner>/openwrt-
# imagebuilder:<target>-<subtarget>-<suffix> (a copy of the official release
# container, or the official snapshot container with setup.sh already run).
# This workflow only READS it: the daily refresh (refresh-images.yml,
# scheduled by the caller) creates and updates it, so no job here has
# `packages: write` and none downloads an ImageBuilder. A missing image fails
# the job with the command that refreshes it by hand; an image that differs
# from its upstream for more than the line's image_grace_days only raises a
# warning annotation. A custom image of a profile that is not in the refresh
# (ib_fallback) takes the official container, downloaded at run time.
name: images

on:
  workflow_call:
    inputs:
      line:
        description: OpenWrt line, a key of harness/lines.yml (e.g. "25.12")
        type: string
        required: true
      package:
        description: >-
          Package name; its apk-<package>-<line>-<arch> artifacts from
          build.yml in the same workflow run are installed in the images.
          Empty: images without a package of their own.
        type: string
        required: false
        default: ""
      profiles:
        description: >-
          Image profiles, separated by spaces or newlines, each
          <target>/<subtarget>/<profile> (e.g. mediatek/filogic/bananapi_bpi-r3),
          optionally followed by :too-big for an image known not to fit the
          flash. Checked against profiles.json of the line; the package
          architecture is read from it. Empty: no image is built (the image
          jobs are skipped and the summary says so).
        type: string
        required: false
        default: ""
      packages:
        description: >-
          Packages added to every image next to the built package, separated
          by spaces or newlines; -<name> removes one (Image Builder PACKAGES
          syntax, e.g. "-dnsmasq dnsmasq-full"). Empty: none.
        type: string
        required: false
        default: ""
      ib_container:
        description: >-
          GHCR repository of the harness ImageBuilder image,
          ghcr.io/<owner>/<name> (lowercase). Published by the daily refresh
          (refresh-images.yml), read anonymously by the image jobs.
        type: string
        required: false
        default: ghcr.io/wehagy/openwrt-imagebuilder
      ib_fallback:
        description: >-
          When the harness ImageBuilder image is missing (the profile is not in
          the refresh of the caller), use the official OpenWrt container,
          downloaded at run time, with a notice, instead of failing. Nothing is
          written to GHCR. For one-off images such as the custom-image form.
        type: boolean
        required: false
        default: false
      refresh_repository:
        description: >-
          Repository that owns the refresh workflow (<owner>/<name>), named in
          the command a missing image fails with. Empty: the calling
          repository (github.repository), right when the caller schedules the
          refresh; a repository that only runs this workflow for its own tests
          names the one that does.
        type: string
        required: false
        default: ""
      ci_ref:
        description: >-
          Ref (branch, tag or commit) of wehagy/openwrt-ci the scripts, harness data
          and Dockerfile are checked out from; use the same ref as the `uses:` of
          this workflow
        type: string
        required: false
        default: main

permissions:
  contents: read

# `shell: bash` makes GitHub run `bash --noprofile --norc -eo pipefail {0}`;
# the default `bash -e {0}` has no pipefail, so `script | tee` would hide the
# script's failure.
defaults:
  run:
    shell: bash

# The repository the harness is checked out from (first step of every job), and
# the one place that names the ImageBuilder image repository (the `ib_container`
# input; scripts/resolve-image.sh lowercases and validates it).
env:
  HARNESS_CI_REPOSITORY: wehagy/openwrt-ci
  HARNESS_IB_CONTAINER: ${{ inputs.ib_container }}

jobs:
  # The profiles come from the `profiles` input, resolved against profiles.json.
  profiles:
    name: profiles ${{ inputs.line }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      # The harness (scripts/, harness/, docker/) is checked out explicitly: a
      # reusable workflow runs in the caller's context, so a plain checkout
      # would fetch the calling repository. Everything runs from ci-base/.
      - name: Check out the harness
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.HARNESS_CI_REPOSITORY }}
          ref: ${{ inputs.ci_ref }}
          path: ci-base
          persist-credentials: false

      - name: Report revisions
        env:
          HARNESS_CI_REF: ${{ inputs.ci_ref }}
        run: ci-base/scripts/report-revisions.sh

      # Fixed make.log fixtures: a "too big" message that numbers do not
      # prove must fail, so no failure becomes a green expected failure.
      - name: Outcome check self-test
        run: ci-base/scripts/image-outcome-selftest.sh

      # The freshness rule of the image the jobs read (the warning of a stale
      # image) and the readers of its labels, with a stub curl.
      - name: Image freshness self-test
        run: ci-base/scripts/image-decide-selftest.sh

      # The readers of the image (missing, private, fallback, stale) and the
      # command a missing image fails with, with a stub registry.
      - name: Image read self-test
        run: ci-base/scripts/image-read-selftest.sh

      # Fixed text: the pinned package list, the apk metadata, the check that
      # the image holds the local apk and the FormatPackages repair.
      - name: Package pin self-test
        run: ci-base/scripts/ib-pins-selftest.sh

      # Validators and resolution of the image inputs, with fixed inputs and
      # a fake mirror (no network).
      - name: Image inputs self-test
        run: ci-base/scripts/image-inputs-selftest.sh

      - name: Validate inputs
        if: ${{ inputs.package != '' }}
        env:
          HARNESS_LINE: ${{ inputs.line }}
          HARNESS_PACKAGE: ${{ inputs.package }}
          HARNESS_SOURCE: artifact
        run: ci-base/scripts/validate-inputs.sh

      - name: Validate the packages input
        env:
          IMAGE_PACKAGES: ${{ inputs.packages }}
        run: |
          . ci-base/scripts/lib/common.sh
          . ci-base/scripts/lib/image-inputs.sh
          check_image_packages "${IMAGE_PACKAGES}"

      # Every profile is looked up in the profiles.json of the line: an
      # unknown target or profile fails here, before any image job.
      - name: Build matrix
        id: matrix
        env:
          LINE: ${{ inputs.line }}
          HARNESS_PROFILES: ${{ inputs.profiles }}
        run: ci-base/scripts/resolve-profiles.sh "${LINE}" | tee -a "${GITHUB_OUTPUT}"

      # No profile, no image: say so where it can be read.
      - name: No profile given
        if: ${{ steps.matrix.outputs.count == '0' }}
        run: |
          echo "::notice::images: no profile given, no image is built"
          echo "### images: no profile given, no image is built" >>"${GITHUB_STEP_SUMMARY}"

      # Fail here, not later in the image job's fromJSON, if no matrix was set.
      - name: Check matrix
        env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          [ -n "${MATRIX}" ] || { echo "::error::matrix output is empty"; exit 1; }
          printf 'matrix=%s\n' "${MATRIX}"

  image:
    if: ${{ needs.profiles.outputs.count != '0' }}
    needs: profiles
    name: ${{ inputs.line }} ${{ matrix.profile }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.profiles.outputs.matrix) }}
    env:
      IB_OUT: ${{ github.workspace }}/ib-out
      IMAGE_OUT: ${{ github.workspace }}/image-out
      APK_IN: ${{ github.workspace }}/apk-in
    steps:
      # The harness (scripts/, harness/, docker/) is checked out explicitly: a
      # reusable workflow runs in the caller's context, so a plain checkout
      # would fetch the calling repository. Everything runs from ci-base/.
      - name: Check out the harness
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.HARNESS_CI_REPOSITORY }}
          ref: ${{ inputs.ci_ref }}
          path: ci-base
          persist-credentials: false

      - name: Report revisions
        env:
          HARNESS_CI_REF: ${{ inputs.ci_ref }}
        run: ci-base/scripts/report-revisions.sh

      # Validates the inputs; the output is written to $GITHUB_ENV only when
      # the script succeeded.
      - name: Resolve line, profile and package
        env:
          LINE: ${{ inputs.line }}
          PROFILE_ID: ${{ matrix.profile }}
          PACKAGE: ${{ inputs.package }}
          HARNESS_IMAGE_TARGET: ${{ matrix.target }}
          HARNESS_IMAGE_SUBTARGET: ${{ matrix.subtarget }}
          HARNESS_IMAGE_DEVICE: ${{ matrix.device }}
          HARNESS_IMAGE_ARCH: ${{ matrix.arch }}
          HARNESS_IMAGE_EXPECT: ${{ matrix.expect }}
          HARNESS_IMAGE_PACKAGES: ${{ inputs.packages }}
          HARNESS_IB_FALLBACK: ${{ inputs.ib_fallback }}
        run: |
          resolved=$(ci-base/scripts/resolve-image.sh "${LINE}" "${PROFILE_ID}" "${PACKAGE}")
          echo "${resolved}" | tee -a "${GITHUB_ENV}"

      - uses: actions/download-artifact@v8.0.2
        if: ${{ inputs.package != '' }}
        with:
          name: apk-${{ env.HARNESS_PACKAGE }}-${{ inputs.line }}-${{ env.HARNESS_ARCH }}
          path: ${{ env.APK_IN }}

      - name: Record the package version
        if: ${{ inputs.package != '' }}
        run: |
          . ci-base/scripts/lib/common.sh
          apk=$(find_apk "${APK_IN}" "${HARNESS_PACKAGE}")
          version=$(apk_version "${apk}" "${HARNESS_PACKAGE}")
          echo "HARNESS_PACKAGE_VERSION=${version}" | tee -a "${GITHUB_ENV}"

      # Reads the labels anonymously first: a missing or private image fails
      # with the manual refresh command, a stale one only warns.
      - name: Pull the ImageBuilder image
        env:
          HARNESS_REFRESH_REPOSITORY: ${{ inputs.refresh_repository || github.repository }}
        run: ci-base/scripts/pull-imagebuilder.sh "${HARNESS_IB_IMAGE}" | tee -a "${GITHUB_ENV}"

      # The container user (uid 1000) is not the runner user, so the output
      # directory is world-writable.
      - name: Build the image
        run: |
          mkdir -m 0777 "${IB_OUT}"
          docker run --rm \
            --env HARNESS_PROFILE --env HARNESS_PACKAGES --env HARNESS_PACKAGE \
            --env HARNESS_TARGET_PATH --env HARNESS_IB_SETUP \
            --volume "${GITHUB_WORKSPACE}/ci-base/scripts:/harness/scripts:ro" \
            --volume "${APK_IN}:/harness/in:ro" \
            --volume "${IB_OUT}:/harness/out" \
            "${HARNESS_IB_IMAGE}" sh /harness/scripts/imagebuilder-make.sh

      # Passes only when the result is the declared one (:too-big on the
      # profile): an image that fits, or the Image Builder's "too big" for a
      # profile expected not to fit.
      - name: Check the Image Builder outcome
        run: ci-base/scripts/check-image-outcome.sh "${IB_OUT}" | tee -a "${GITHUB_ENV}"

      # An image that does not fit was deleted by the Image Builder: nothing
      # to check or keep (the summary has the sizes and the messages).
      - name: Check the manifest and collect the images
        if: ${{ env.HARNESS_OUTCOME == 'fits' }}
        run: ci-base/scripts/collect-images.sh "${IB_OUT}" "${IMAGE_OUT}" | tee -a "${GITHUB_ENV}"

      - name: Summary
        if: ${{ !cancelled() && env.HARNESS_IB_IMAGE != '' }}
        env:
          HARNESS_JOB_STATUS: ${{ job.status }}
        run: ci-base/scripts/image-summary.sh "${IB_OUT}" "${IMAGE_OUT}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v7.0.2
        if: ${{ env.HARNESS_OUTCOME == 'fits' }}
        with:
          name: ${{ env.HARNESS_ARTIFACT }}
          path: ${{ env.IMAGE_OUT }}
          if-no-files-found: error
