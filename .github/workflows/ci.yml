# Tests the harness itself: builds a sample package (netbird) for both lines,
# tests each build in QEMU and builds its images, on every push to a feature
# branch. Can also be started by hand to force the SDK images to be rebuilt
# (refresh_sdk) and to build only one line. Packages of their own live in
# wehagy/openwrt-ci-packages, which calls the same workflows.
#
# ci_ref is the commit under test: the called workflows check the scripts out
# of that commit (not of main), so a branch tests its own scripts.
name: ci

on:
  push:
    branches: ["feat/**"]
  workflow_dispatch:
    inputs:
      refresh_sdk:
        description: Rebuild the SDK images of the selected lines even when fresh
        type: boolean
        default: false
      lines:
        description: Lines to build
        type: choice
        options: [both, "25.12", main]
        default: both

permissions:
  contents: read

jobs:
  # build.yml pushes the SDK images to GHCR, hence packages: write.
  build-25-12:
    if: ${{ inputs.lines != 'main' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      ci_ref: ${{ github.sha }}
      line: "25.12"
      package: netbird
      refresh_sdk: ${{ inputs.refresh_sdk == true }}

  build-main:
    if: ${{ inputs.lines != '25.12' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      ci_ref: ${{ github.sha }}
      line: main
      package: netbird
      refresh_sdk: ${{ inputs.refresh_sdk == true }}

  test-25-12:
    needs: build-25-12
    uses: ./.github/workflows/test.yml
    with:
      ci_ref: ${{ github.sha }}
      line: "25.12"
      package: netbird
      source: artifact

  # Snapshot images of line main, with the package built from the main SDK.
  test-main:
    needs: build-main
    uses: ./.github/workflows/test.yml
    with:
      ci_ref: ${{ github.sha }}
      line: main
      package: netbird
      source: artifact

  image-25-12:
    needs: build-25-12
    uses: ./.github/workflows/images.yml
    with:
      ci_ref: ${{ github.sha }}
      line: "25.12"
      package: netbird

  image-main:
    needs: build-main
    uses: ./.github/workflows/images.yml
    with:
      ci_ref: ${{ github.sha }}
      line: main
      package: netbird
