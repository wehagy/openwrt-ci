# Responsibility: per-QEMU-target data used by the harness scripts.
#
# Keys:
#   lg_env    target file in aparcar/openwrt-tests/targets/
#   arch      package architecture of the official apk feed
#   path      target path below the release directory
#   memory    VM memory. The default is 128M for every target, the value of
#             the targets/qemu_*.yaml of aparcar/openwrt-tests (checked at
#             b3a04b2). A caller overrides it for all the targets it tests with
#             the `memory` input of test.yml (64M-1024M) when its package needs
#             more: netbird needs 256M (OOM-killed at 128M on x86-64, run
#             41480369349).
#   kvm       true when the runner offers /dev/kvm for this guest architecture
#   qemu_pkg  apt package providing the qemu-system binary
#   images    image file name per line; {release} is expanded. A line that is
#             absent here is not tested on the target (explicit gaps are
#             commented in place)

targets:
  x86-64:
    lg_env: qemu_x86-64.yaml
    arch: x86_64
    path: x86/64
    memory: 128M
    kvm: true
    qemu_pkg: qemu-system-x86
    images:
      "25.12": openwrt-{release}-x86-64-generic-squashfs-combined.img.gz
      main: openwrt-x86-64-generic-squashfs-combined.img.gz
  armsr-armv8:
    lg_env: qemu_armsr-armv8.yaml
    arch: aarch64_generic
    path: armsr/armv8
    memory: 128M
    kvm: false
    qemu_pkg: qemu-system-arm
    images:
      "25.12": openwrt-{release}-armsr-armv8-generic-initramfs-kernel.bin
      main: openwrt-armsr-armv8-generic-initramfs-kernel.bin
  malta-le:
    lg_env: qemu_malta-le.yaml
    arch: mipsel_24kc
    path: malta/le
    memory: 128M
    kvm: false
    qemu_pkg: qemu-system-mips
    images:
      "25.12": openwrt-{release}-malta-le-vmlinux-initramfs.elf
      main: openwrt-malta-le-generic-initramfs-kernel.bin
  malta-be:
    lg_env: qemu_malta-be.yaml
    arch: mips_24kc
    path: malta/be
    memory: 128M
    kvm: false
    qemu_pkg: qemu-system-mips
    images:
      "25.12": openwrt-{release}-malta-be-vmlinux-initramfs.elf
      main: openwrt-malta-be-generic-initramfs-kernel.bin
