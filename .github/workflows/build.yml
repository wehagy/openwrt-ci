# Reusable workflow: build one package for the architectures of a line with
# the OpenWrt SDK (openwrt/gh-action-sdk, as the openwrt/packages CI does) from
# a package tree, and upload the .apk. By default the tree is the openwrt/packages
# branch of the line; feed_repository and feed_ref select another one (a branch
# or commit of a test repository, a pull request of openwrt/packages).
#
# The SDK comes from the harness image ghcr.io/<owner>/openwrt-sdk:<arch>-<tag>,
# derived from the official snapshot SDK container with setup.sh already run
# (the SDK download from the OpenWrt mirror takes ~14 min). This workflow only
# READS it: the daily refresh (refresh-images.yml, scheduled by the caller)
# creates and updates it, so no job here has `packages: write` and none
# rebuilds an image by age. A missing image fails the `sdk` job with the
# command that refreshes it by hand; an image that differs from its upstream
# for more than the line's image_grace_days only raises a warning annotation.
# The `sdk` job pins the image by digest, so the build never reads an image
# the refresh replaces meanwhile.
name: build

on:
  workflow_call:
    inputs:
      line:
        description: OpenWrt line, a key of harness/lines.yml (e.g. "25.12")
        type: string
        required: true
      package:
        description: Package name to build (a directory of openwrt/packages)
        type: string
        required: true
      sdk_container:
        description: >-
          GHCR repository of the harness SDK image, ghcr.io/<owner>/<name>
          (lowercase). Published by the daily refresh (refresh-images.yml),
          read anonymously by sdk.
        type: string
        required: false
        default: ghcr.io/wehagy/openwrt-sdk
      archs:
        description: >-
          Package architectures to build, separated by spaces or newlines:
          literal names (e.g. x86_64), @tests (the architectures of the QEMU
          test targets of harness/targets.yml) and @profiles (the
          architectures of the profiles input). The SDK image of every
          architecture must exist (the daily refresh creates it; list the
          architecture in the caller of refresh-images.yml before using it).
        type: string
        required: false
        default: "@tests @profiles"
      targets:
        description: >-
          QEMU test targets whose architectures @tests stands for (same value
          as the targets input of test.yml). Empty: all targets of
          harness/targets.yml.
        type: string
        required: false
        default: ""
      profiles:
        description: >-
          Image profiles whose architectures @profiles adds (same format as
          the profiles input of images.yml, checked against profiles.json of
          the line). Empty: none.
        type: string
        required: false
        default: ""
      feed_repository:
        description: >-
          GitHub repository of the package tree to build from, <owner>/<name>
          (public). Empty or openwrt/packages: the upstream feed.
        type: string
        required: false
        default: openwrt/packages
      feed_ref:
        description: >-
          Ref of feed_repository to build: a branch, a tag, a full commit SHA or
          refs/pull/<n>/head. Empty: the packages_branch of the line in
          harness/lines.yml (openwrt-25.12 or master).
        type: string
        required: false
        default: ""
      ci_ref:
        description: >-
          Ref (branch, tag or commit) of wehagy/openwrt-ci the scripts, harness data
          and Dockerfile are checked out from; use the same ref as the `uses:` of
          this workflow
        type: string
        required: false
        default: main

    outputs:
      feed_repository:
        description: Repository the package tree was built from
        value: ${{ jobs.feed.outputs.repository }}
      feed_ref:
        description: Ref that was requested (the line's default when none was given)
        value: ${{ jobs.feed.outputs.ref }}
      feed_sha:
        description: Full commit SHA of the package tree that was built
        value: ${{ jobs.feed.outputs.sha }}

permissions:
  contents: read

# The one place that names the SDK image repository (the `sdk_container` input,
# with its default): published by the daily refresh, read by `sdk` and passed to
# openwrt/gh-action-sdk as CONTAINER (scripts/resolve-sdk.sh lowercases and
# validates it, and has no default of its own). HARNESS_CI_REPOSITORY is the
# repository the harness is checked out from (first step of every job).
env:
  HARNESS_SDK_CONTAINER: ${{ inputs.sdk_container }}
  HARNESS_CI_REPOSITORY: wehagy/openwrt-ci

jobs:
  # Validates the feed source and resolves it to one commit, once for the whole
  # run: the architecture jobs below check out that SHA, so a branch that moves
  # during the run cannot give two architectures different trees. The outputs
  # are the workflow's feed_repository, feed_ref and feed_sha. It runs before
  # sdk so that an invalid input fails before any architecture job starts.
  feed:
    name: feed ${{ inputs.line }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash # adds pipefail
    outputs:
      archs: ${{ steps.archs.outputs.matrix }}
      repository: ${{ steps.record.outputs.repository }}
      ref: ${{ steps.record.outputs.ref }}
      sha: ${{ steps.record.outputs.sha }}
    steps:
      # The harness (scripts/, harness/, docker/) is checked out explicitly: a
      # reusable workflow runs in the caller's context, so a plain checkout
      # would fetch the calling repository. Everything runs from ci-base/.
      - name: Check out the harness
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.HARNESS_CI_REPOSITORY }}
          ref: ${{ inputs.ci_ref }}
          path: ci-base
          persist-credentials: false

      - name: Report revisions
        env:
          HARNESS_CI_REF: ${{ inputs.ci_ref }}
        run: ci-base/scripts/report-revisions.sh

      - name: Feed source self-test
        run: ci-base/scripts/feed-inputs-selftest.sh

      # The freshness rule of the image the sdk job reads (the warning of a
      # stale image) and the readers of its labels, with a stub curl.
      - name: Image freshness self-test
        run: ci-base/scripts/image-decide-selftest.sh

      - name: Image inputs self-test
        run: ci-base/scripts/image-inputs-selftest.sh

      # The architecture matrix of sdk. A profile that does not exist fails
      # here, before any architecture job.
      - name: Resolve the architectures
        id: archs
        env:
          LINE: ${{ inputs.line }}
          HARNESS_ARCHS: ${{ inputs.archs }}
          HARNESS_PROFILES: ${{ inputs.profiles }}
          HARNESS_TARGETS: ${{ inputs.targets }}
        run: |
          resolved=$(ci-base/scripts/resolve-archs.sh "${LINE}")
          echo "${resolved}" | tee -a "${GITHUB_OUTPUT}"
          echo "### architectures" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- $(echo "${resolved}" | sed -n -e 's/^archs=//p')" | tee -a "${GITHUB_STEP_SUMMARY}"

      # Validates the inputs; the output is written to $GITHUB_ENV only when
      # the script succeeded.
      - name: Resolve the feed source
        env:
          LINE: ${{ inputs.line }}
          FEED_REPOSITORY: ${{ inputs.feed_repository }}
          FEED_REF: ${{ inputs.feed_ref }}
        run: |
          resolved=$(ci-base/scripts/resolve-feed.sh "${LINE}" "${FEED_REPOSITORY}" "${FEED_REF}")
          echo "${resolved}" | tee -a "${GITHUB_ENV}"

      - name: Check out the feed
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.HARNESS_PACKAGES_REPOSITORY }}
          ref: ${{ env.HARNESS_PACKAGES_REF }}
          path: packages-feed
          persist-credentials: false

      - name: Record the feed commit
        id: record
        run: |
          ci-base/scripts/feed-record.sh packages-feed | tee -a "${GITHUB_OUTPUT}"
          ci-base/scripts/feed-record.sh --summary packages-feed | tee -a "${GITHUB_STEP_SUMMARY}"

  sdk:
    needs: feed
    name: ${{ inputs.line }} ${{ matrix.arch }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.feed.outputs.archs) }}
    defaults:
      run:
        shell: bash # adds pipefail, so `script | tee` keeps the script's status
    env:
      SDK_OUT: ${{ github.workspace }}/sdk-out
      APK_OUT: ${{ github.workspace }}/apk-out
    steps:
      # The harness (scripts/, harness/, docker/) is checked out explicitly: a
      # reusable workflow runs in the caller's context, so a plain checkout
      # would fetch the calling repository. Everything runs from ci-base/.
      - name: Check out the harness
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.HARNESS_CI_REPOSITORY }}
          ref: ${{ inputs.ci_ref }}
          path: ci-base
          persist-credentials: false

      - name: Report revisions
        env:
          HARNESS_CI_REF: ${{ inputs.ci_ref }}
        run: ci-base/scripts/report-revisions.sh

      # Validates the inputs; the output is written to $GITHUB_ENV only when
      # the script succeeded.
      - name: Resolve line, arch, package and feed
        env:
          LINE: ${{ inputs.line }}
          ARCH: ${{ matrix.arch }}
          PACKAGE: ${{ inputs.package }}
          FEED_REPOSITORY: ${{ needs.feed.outputs.repository }}
          FEED_REF: ${{ needs.feed.outputs.ref }}
          FEED_SHA: ${{ needs.feed.outputs.sha }}
        run: |
          resolved=$(ci-base/scripts/resolve-build.sh "${LINE}" "${ARCH}" "${PACKAGE}" \
            "${FEED_REPOSITORY}" "${FEED_REF}" "${FEED_SHA}")
          echo "${resolved}" | tee -a "${GITHUB_ENV}"

      # A full tree, not just the package: Go packages include
      # ../../lang/golang/golang-package.mk by relative path. The commit is
      # the one the feed job resolved, the same for every architecture.
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.HARNESS_PACKAGES_REPOSITORY }}
          ref: ${{ env.HARNESS_PACKAGES_SHA }}
          path: packages-feed
          persist-credentials: false

      # Pins the SDK image: reads it anonymously, as the build below pulls
      # it, fails with the manual refresh command if it is missing or private,
      # warns if it is stale, and records <tag>@<digest> (HARNESS_SDK_PIN).
      - name: Pin the SDK image
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          info=$(ci-base/scripts/sdk-image-info.sh)
          echo "${info}" | tee -a "${GITHUB_ENV}"

      # The init-script format check of the SDK runs shfmt; an image without it
      # would validate nothing, so the job fails here instead.
      - name: Check that the SDK image has shfmt
        run: docker run --rm --entrypoint shfmt "${HARNESS_SDK_CONTAINER}:${HARNESS_SDK_PIN}" --version

      - name: Check the feed commit and record the build start
        run: |
          sha=$(git -C packages-feed rev-parse HEAD)
          if [ "${sha}" != "${HARNESS_PACKAGES_SHA}" ]; then
            echo "::error::feed checkout is at ${sha}, expected ${HARNESS_PACKAGES_SHA}"
            exit 1
          fi
          start=$(date +%s)
          mkdir -p "${SDK_OUT}"
          echo "HARNESS_BUILD_START=${start}" >> "${GITHUB_ENV}"

      # Pinned to a commit of the action's main branch.
      - uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          CONTAINER: ${{ env.HARNESS_SDK_CONTAINER }}
          # The action builds `FROM $CONTAINER:$ARCH`; <tag>@<digest> is valid.
          ARCH: ${{ env.HARNESS_SDK_PIN }}
          FEED_DIR: ${{ github.workspace }}/packages-feed
          ARTIFACTS_DIR: ${{ env.SDK_OUT }}
          PACKAGES: ${{ env.HARNESS_PACKAGE }}

      - name: Collect the package
        run: |
          now=$(date +%s)
          echo "HARNESS_BUILD_SECONDS=$(( now - HARNESS_BUILD_START ))" >> "${GITHUB_ENV}"
          ci-base/scripts/collect-apk.sh "${SDK_OUT}/bin/packages" "${APK_OUT}" | tee -a "${GITHUB_ENV}"

      - name: Summary
        run: ci-base/scripts/build-summary.sh | tee -a "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: apk-${{ env.HARNESS_PACKAGE }}-${{ inputs.line }}-${{ matrix.arch }}
          path: ${{ env.APK_OUT }}
          if-no-files-found: error
