# Responsibility: the data of the image workflow (images.yml) that belongs to
# the base: the files kept as artifacts. The images a caller wants (profiles,
# extra packages) are inputs of images.yml and live in the calling repository;
# the base has no default profile (a caller that gives none gets no image).
#
# Keys:
#   image_globs  file name globs of the images kept as artifacts (the
#                firmware to flash; rootfs/kernel parts are left out)

image_globs: "*sysupgrade* *factory* *combined* *sdcard*"
