# Reusable workflow: build one package for the 5 architectures of a line with
# the OpenWrt SDK (openwrt/gh-action-sdk, as the openwrt/packages CI does) from
# the openwrt/packages branch of that line, and upload the .apk.
#
# The SDK comes from the harness image ghcr.io/<owner>/openwrt-sdk:<arch>-<tag>,
# derived from the official snapshot SDK container with setup.sh already run
# (the SDK download from the OpenWrt mirror takes ~14 min). The `sdk-image` job
# rebuilds it when it is missing, older than the line's sdk_max_age_days or
# refresh_sdk is set; otherwise it is reused. The `sdk` job pins the image by
# digest, so the build never reads an image another run replaces. The caller
# must grant `packages: write` to the job that calls this workflow. A rebuild
# pushes with the CALLER's GITHUB_TOKEN, so the package needs "Manage Actions
# access" for the calling repository (README, "SDK image access").
name: build

on:
  workflow_call:
    inputs:
      line:
        description: OpenWrt line, a key of harness/lines.yml (e.g. "25.12")
        type: string
        required: true
      package:
        description: Package name to build (a directory of openwrt/packages)
        type: string
        required: true
      refresh_sdk:
        description: Rebuild the SDK images of the line even when they are fresh
        type: boolean
        required: false
        default: false
      sdk_container:
        description: >-
          GHCR repository of the harness SDK image, ghcr.io/<owner>/<name>
          (lowercase). Published by sdk-image, read anonymously by sdk.
        type: string
        required: false
        default: ghcr.io/wehagy/openwrt-sdk
      ci_ref:
        description: >-
          Ref (branch, tag or commit) of wehagy/openwrt-ci the scripts, harness data
          and Dockerfile are checked out from; use the same ref as the `uses:` of
          this workflow
        type: string
        required: false
        default: main

permissions:
  contents: read

# The one place that names the SDK image repository (the `sdk_container` input,
# with its default): published by `sdk-image`, read by `sdk` and passed to
# openwrt/gh-action-sdk as CONTAINER (scripts/resolve-sdk.sh lowercases and
# validates it, and has no default of its own). HARNESS_CI_REPOSITORY is the
# repository the harness is checked out from (first step of every job).
env:
  HARNESS_SDK_CONTAINER: ${{ inputs.sdk_container }}
  HARNESS_CI_REPOSITORY: wehagy/openwrt-ci

jobs:
  # No `concurrency` group: GitHub keeps one running and one pending job per
  # group and cancels the older pending one, which would cancel the build of a
  # run whenever 3 runs (or the packages of the next slice) need the same
  # rebuild. Instead, scripts/sdk-image-ensure.sh decides again after its
  # local build, just before the push, and discards the build if another run
  # pushed a fresh image meanwhile; it keeps the superseded image as
  # <tag>-prev, so an in-flight build that pinned it keeps working.
  sdk-image:
    name: sdk-image ${{ inputs.line }} ${{ matrix.arch }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64_generic, aarch64_cortex-a53, mipsel_24kc, mips_24kc]
    defaults:
      run:
        shell: bash # adds pipefail
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      HARNESS_REFRESH_SDK: ${{ inputs.refresh_sdk }}
    steps:
      # The harness (scripts/, harness/, docker/) is checked out explicitly: a
      # reusable workflow runs in the caller's context, so a plain checkout
      # would fetch the calling repository. Everything runs from ci-base/.
      - name: Check out the harness
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.HARNESS_CI_REPOSITORY }}
          ref: ${{ inputs.ci_ref }}
          path: ci-base
          persist-credentials: false

      - name: Report revisions
        env:
          HARNESS_CI_REF: ${{ inputs.ci_ref }}
        run: ci-base/scripts/report-revisions.sh

      - name: Age rule self-test
        run: ci-base/scripts/sdk-age-selftest.sh

      # Validates the inputs; the output is written to $GITHUB_ENV only when
      # the script succeeded.
      - name: Resolve line and arch
        env:
          LINE: ${{ inputs.line }}
          ARCH: ${{ matrix.arch }}
        run: |
          resolved=$(ci-base/scripts/resolve-sdk.sh "${LINE}" "${ARCH}")
          echo "${resolved}" | tee -a "${GITHUB_ENV}"

      - name: Reuse or rebuild the SDK image
        run: ci-base/scripts/sdk-image-ensure.sh

  sdk:
    needs: sdk-image
    name: ${{ inputs.line }} ${{ matrix.arch }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64_generic, aarch64_cortex-a53, mipsel_24kc, mips_24kc]
    defaults:
      run:
        shell: bash # adds pipefail, so `script | tee` keeps the script's status
    env:
      SDK_OUT: ${{ github.workspace }}/sdk-out
      APK_OUT: ${{ github.workspace }}/apk-out
    steps:
      # The harness (scripts/, harness/, docker/) is checked out explicitly: a
      # reusable workflow runs in the caller's context, so a plain checkout
      # would fetch the calling repository. Everything runs from ci-base/.
      - name: Check out the harness
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.HARNESS_CI_REPOSITORY }}
          ref: ${{ inputs.ci_ref }}
          path: ci-base
          persist-credentials: false

      - name: Report revisions
        env:
          HARNESS_CI_REF: ${{ inputs.ci_ref }}
        run: ci-base/scripts/report-revisions.sh

      # Validates the inputs; the output is written to $GITHUB_ENV only when
      # the script succeeded.
      - name: Resolve line, arch and package
        env:
          LINE: ${{ inputs.line }}
          ARCH: ${{ matrix.arch }}
          PACKAGE: ${{ inputs.package }}
        run: |
          resolved=$(ci-base/scripts/resolve-build.sh "${LINE}" "${ARCH}" "${PACKAGE}")
          echo "${resolved}" | tee -a "${GITHUB_ENV}"

      # A full tree, not just the package: Go packages include
      # ../../lang/golang/golang-package.mk by relative path.
      - uses: actions/checkout@v7.0.1
        with:
          repository: openwrt/packages
          ref: ${{ env.HARNESS_PACKAGES_BRANCH }}
          path: packages-feed
          persist-credentials: false

      # Pins the SDK image: reads it anonymously, as the build below pulls
      # it, fails if it is private, and records <tag>@<digest> (HARNESS_SDK_PIN).
      # The age is not checked again: sdk-image decided it for this run.
      - name: Pin the SDK image
        run: |
          info=$(ci-base/scripts/sdk-image-info.sh)
          echo "${info}" | tee -a "${GITHUB_ENV}"

      - name: Record feed commit and build start
        run: |
          sha=$(git -C packages-feed rev-parse HEAD)
          start=$(date +%s)
          mkdir -p "${SDK_OUT}"
          {
            echo "HARNESS_PACKAGES_SHA=${sha}"
            echo "HARNESS_BUILD_START=${start}"
          } >> "${GITHUB_ENV}"

      # Pinned to a commit of the action's main branch.
      - uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          CONTAINER: ${{ env.HARNESS_SDK_CONTAINER }}
          # The action builds `FROM $CONTAINER:$ARCH`; <tag>@<digest> is valid.
          ARCH: ${{ env.HARNESS_SDK_PIN }}
          FEED_DIR: ${{ github.workspace }}/packages-feed
          ARTIFACTS_DIR: ${{ env.SDK_OUT }}
          PACKAGES: ${{ env.HARNESS_PACKAGE }}

      - name: Collect the package
        run: |
          now=$(date +%s)
          echo "HARNESS_BUILD_SECONDS=$(( now - HARNESS_BUILD_START ))" >> "${GITHUB_ENV}"
          ci-base/scripts/collect-apk.sh "${SDK_OUT}/bin/packages" "${APK_OUT}" | tee -a "${GITHUB_ENV}"

      - name: Summary
        run: ci-base/scripts/build-summary.sh >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: apk-${{ env.HARNESS_PACKAGE }}-${{ inputs.line }}-${{ matrix.arch }}
          path: ${{ env.APK_OUT }}
          if-no-files-found: error
