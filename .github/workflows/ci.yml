# Caller: build the package for both lines, then test each build in QEMU on
# every push to a feature branch. Can also be started by hand to force the
# SDK images to be rebuilt (refresh_sdk) and to build only one line.
name: ci

on:
  push:
    branches: ["feat/**"]
  workflow_dispatch:
    inputs:
      refresh_sdk:
        description: Rebuild the SDK images of the selected lines even when fresh
        type: boolean
        default: false
      tmp_cleanup:
        description: TEMPORARY delete the SDK package instead of building
        type: boolean
        default: false
      lines:
        description: Lines to build
        type: choice
        options: [both, "25.12", main]
        default: both

permissions:
  contents: read

jobs:
  # build.yml pushes the SDK images to GHCR, hence packages: write.
  build-25-12:
    if: ${{ inputs.lines != 'main' && !inputs.tmp_cleanup }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      line: "25.12"
      package: netbird
      refresh_sdk: ${{ inputs.refresh_sdk == true }}

  build-main:
    if: ${{ inputs.lines != '25.12' && !inputs.tmp_cleanup }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      line: main
      package: netbird
      refresh_sdk: ${{ inputs.refresh_sdk == true }}

  tmp-cleanup:
    if: ${{ inputs.tmp_cleanup }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Versions before
        run: |
          gh api --paginate "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/openwrt-sdk/versions" \
            --jq '.[] | [.id, .name, (.metadata.container.tags | join(",")), .created_at] | @tsv'
      - name: Delete the package
        run: gh api -X DELETE "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/openwrt-sdk"
      - name: Package after
        run: |
          if gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/openwrt-sdk"; then
            echo "package still exists"
            exit 1
          fi
          echo "package gone"

  test-25-12:
    needs: build-25-12
    if: ${{ !inputs.tmp_cleanup }}
    uses: ./.github/workflows/test.yml
    with:
      line: "25.12"
      package: netbird
      source: artifact

  # Snapshot images of line main, with the package built from the main SDK.
  test-main:
    needs: build-main
    uses: ./.github/workflows/test.yml
    with:
      line: main
      package: netbird
      source: artifact
