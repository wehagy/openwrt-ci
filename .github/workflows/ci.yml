# Tests the harness itself: builds a sample package (wsdd2) for both lines,
# tests each build in QEMU and builds its images, on every push to a feature
# branch. Can also be started by hand to force the SDK images to be rebuilt
# (refresh_sdk) and to build only one line. Packages of their own live in
# wehagy/openwrt-ci-packages, which calls the same workflows.
#
# test-* also exercise the caller side of test.yml against this repository:
# tests_path (harness/sample-tests, real checks of what the tests receive) and
# test_secrets (SAMPLE_SECRET, not defined here: it must arrive exported empty).
#
# A manual run can also build another package tree (feed_repository, feed_ref:
# a test repository or refs/pull/<n>/head of openwrt/packages) and, with
# stages=build, stop after the build; the job feed-report prints the feed
# outputs of build.yml.
#
# ci_ref is the commit under test: the called workflows check the scripts out
# of that commit (not of main), so a branch tests its own scripts.
name: ci

on:
  push:
    branches: ["feat/**"]
  workflow_dispatch:
    inputs:
      refresh_sdk:
        description: Rebuild the SDK images of the selected lines even when fresh
        type: boolean
        default: false
      lines:
        description: Lines to build
        type: choice
        options: [both, "25.12", main]
        default: both
      package:
        description: Package to build (default wsdd2)
        type: string
        default: wsdd2
      feed_repository:
        description: Repository of the package tree (default openwrt/packages)
        type: string
        default: ""
      feed_ref:
        description: Ref of the package tree (default - the branch of the line)
        type: string
        default: ""
      stages:
        description: Stop after the build, or also test and build the images
        type: choice
        options: [all, build]
        default: all
      targets:
        description: QEMU test targets, ids separated by spaces (default - all of harness/targets.yml)
        type: string
        default: ""
      memory:
        description: VM memory of the test targets, NNNM from 64M to 1024M (default - harness/targets.yml)
        type: string
        default: ""
      profiles:
        description: Image profiles, <target>/<subtarget>/<profile>[:too-big] (default - x86/64/generic of harness/images.yml)
        type: string
        default: ""
      packages:
        description: Packages added to the images, -name removes (default - none; the CI uses "-dnsmasq dnsmasq-full")
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # build.yml pushes the SDK images to GHCR, hence packages: write.
  build-25-12:
    if: ${{ inputs.lines != 'main' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      ci_ref: ${{ github.sha }}
      line: "25.12"
      package: ${{ inputs.package || 'wsdd2' }}
      refresh_sdk: ${{ inputs.refresh_sdk == true }}
      feed_repository: ${{ inputs.feed_repository }}
      feed_ref: ${{ inputs.feed_ref }}
      profiles: ${{ inputs.profiles }}
      targets: ${{ inputs.targets }}

  build-main:
    if: ${{ inputs.lines != '25.12' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      ci_ref: ${{ github.sha }}
      line: main
      package: ${{ inputs.package || 'wsdd2' }}
      refresh_sdk: ${{ inputs.refresh_sdk == true }}
      feed_repository: ${{ inputs.feed_repository }}
      feed_ref: ${{ inputs.feed_ref }}
      profiles: ${{ inputs.profiles }}
      targets: ${{ inputs.targets }}

  test-25-12:
    if: ${{ inputs.stages != 'build' }}
    needs: build-25-12
    uses: ./.github/workflows/test.yml
    with:
      ci_ref: ${{ github.sha }}
      line: "25.12"
      package: ${{ inputs.package || 'wsdd2' }}
      source: artifact
      tests_path: harness/sample-tests
      test_secrets: SAMPLE_SECRET
      targets: ${{ inputs.targets }}
      memory: ${{ inputs.memory }}
    secrets: inherit

  # Snapshot images of line main, with the package built from the main SDK.
  test-main:
    if: ${{ inputs.stages != 'build' }}
    needs: build-main
    uses: ./.github/workflows/test.yml
    with:
      ci_ref: ${{ github.sha }}
      line: main
      package: ${{ inputs.package || 'wsdd2' }}
      source: artifact
      tests_path: harness/sample-tests
      test_secrets: SAMPLE_SECRET
      targets: ${{ inputs.targets }}
      memory: ${{ inputs.memory }}
    secrets: inherit

  image-25-12:
    if: ${{ inputs.stages != 'build' }}
    needs: build-25-12
    uses: ./.github/workflows/images.yml
    with:
      ci_ref: ${{ github.sha }}
      line: "25.12"
      package: ${{ inputs.package || 'wsdd2' }}
      profiles: ${{ inputs.profiles }}
      packages: ${{ inputs.packages || '-dnsmasq dnsmasq-full' }}

  image-main:
    if: ${{ inputs.stages != 'build' }}
    needs: build-main
    uses: ./.github/workflows/images.yml
    with:
      ci_ref: ${{ github.sha }}
      line: main
      package: ${{ inputs.package || 'wsdd2' }}
      profiles: ${{ inputs.profiles }}
      packages: ${{ inputs.packages || '-dnsmasq dnsmasq-full' }}

  # What the callers of build.yml read: the feed outputs of the builds.
  feed-report:
    if: ${{ !cancelled() && (needs.build-25-12.result == 'success' || needs.build-main.result == 'success') }}
    needs: [build-25-12, build-main]
    runs-on: ubuntu-26.04
    env:
      B2512_REPOSITORY: ${{ needs.build-25-12.outputs.feed_repository }}
      B2512_REF: ${{ needs.build-25-12.outputs.feed_ref }}
      B2512_SHA: ${{ needs.build-25-12.outputs.feed_sha }}
      BMAIN_REPOSITORY: ${{ needs.build-main.outputs.feed_repository }}
      BMAIN_REF: ${{ needs.build-main.outputs.feed_ref }}
      BMAIN_SHA: ${{ needs.build-main.outputs.feed_sha }}
    steps:
      - name: Print the feed outputs
        run: |
          {
            echo "### feed outputs of build.yml"
            echo "- 25.12: repository=${B2512_REPOSITORY} ref=${B2512_REF} sha=${B2512_SHA}"
            echo "- main: repository=${BMAIN_REPOSITORY} ref=${BMAIN_REF} sha=${BMAIN_SHA}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
