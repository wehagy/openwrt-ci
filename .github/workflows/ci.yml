name: ci

on:
  push:
    branches: ["feat/**"]

permissions:
  contents: read

jobs:
  build-main:
    uses: ./.github/workflows/build.yml
    with:
      line: main
      package: netbird

  test-main:
    needs: build-main
    uses: ./.github/workflows/test.yml
    with:
      line: main
      package: netbird
      source: artifact
